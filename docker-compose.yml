services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: facial_ops
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facial_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: facial_redis
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: facial_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      PORT: 1223
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      SECRET_KEY: ${SECRET_KEY}
      EDGE_API_KEY: ${EDGE_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEBUG: "false"
      ENABLE_FORENSIC_SEARCH: "true"
      TZ: Asia/Kolkata
    volumes:
      - ./backend:/app/backend
      - ./facial_recognition:/app/facial_recognition
      - "D:/:/d"
      - "C:/:/c"
    ports:
      - "1223:1223"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1223/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ./facial-recognition-dashboard
      dockerfile: Dockerfile
    container_name: facial_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:1223
      NEXT_PUBLIC_WS_URL: ws://localhost:1223
      NODE_ENV: production
      TZ: Asia/Kolkata
    ports:
      - "3000:3000"

  detector:
    build:
      context: .
      dockerfile: Dockerfile.detector
    container_name: facial_detector
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:1223
      EDGE_API_KEY: ${EDGE_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      TZ: Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./pending:/app/pending
    # Uncomment deploy block on JarvisLabs / GPU instances:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    profiles:
      - detector
      - full

volumes:
  pgdata:
    driver: local
