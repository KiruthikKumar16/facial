services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: facial_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facial_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facial_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/facial_ops
      PORT: 1223
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SECRET_KEY: dev-secret-key-change-in-production
      EDGE_API_KEY: dev-edge-api-key
      DEBUG: "false"
    ports:
      - "1223:1223"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1223/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./facial-recognition-dashboard
      dockerfile: Dockerfile
    container_name: facial_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:1223
      NEXT_PUBLIC_WS_URL: ws://localhost:1223
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
