services:
  - type: web
    name: facial-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: EDGE_API_KEY
        sync: false
