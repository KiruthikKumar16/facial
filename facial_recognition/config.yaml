# Camera and recognition settings
webcam_index: 0
rtsp_urls:
  # Android IP Webcam — H.264 video-only RTSP stream.
  - rtsp://192.168.1.67:8080/h264.sdp
  - rtsp://192.168.1.53:8080/h264.sdp

# Valid next-camera hops for movement tracking. Omitted origins allow any hop.
camera_routes:
  webcam: [rtsp-1]
  rtsp-1: [rtsp-2]
  rtsp-2: [dvr-1]
  dvr-1: []
max_camera_travel_seconds: 300

# Cosine similarity threshold for identity matching
similarity_threshold: 0.35

# Use GPU backend when available. Install onnxruntime-gpu separately for GPU support.
use_gpu: false

# Resize every frame before inference for speed. This is the detection/embedding frame size.
inference_frame_width: 640
inference_frame_height: 640

# CPU-only tuning: smaller input, more frame skipping, and faster detection path.
# Override at runtime: python facial_recognition/main_cpu.py -r 480 --max
cpu_inference_frame_width: 160
cpu_inference_frame_height: 160
cpu_frame_skip: 4
cpu_recognition_interval: 2
cpu_use_fast_detector: false
cpu_detector_model: buffalo_s
cpu_tier: auto

# Webcam capture size (override with --cam-res on CLI)
camera_width: 640
camera_height: 480

# Known faces enrollment directory and saved gallery file path
known_faces_dir: known_faces
gallery_path: known_faces/gallery.npz

# Log file path for every detection event
log_file: detections.csv

# Database URL for real-time logging to PostgreSQL
# Format: postgresql://user:password@host:port/database
database_url: postgresql://postgres:postgres@localhost:5432/facial_recognition

# Seconds to wait before retrying a dropped or unavailable camera connection
reconnect_interval_seconds: 10
